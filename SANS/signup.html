<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign up • SANS</title>
<meta name="description" content="SANS: Your people. Your space. Your world.">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sans_theme')||'dark'}catch(e){}</script>
</head>
<body class="is-loading" data-page="signup">
<div class="auth">
  <section class="auth__brand">
    <a class="brand brand--lg" href="login.html" aria-label="SANS"><img src="assets/logo.svg" alt=""><span>SANS</span></a>
    <h2 class="auth__tag"><span>Your people.</span><span>Your space.</span>Your world.</h2>
    <div class="auth__collage" aria-hidden="true">
      <img src="assets/images/posts/p1.svg" alt=""><img src="assets/images/posts/p4.svg" alt=""><img src="assets/images/posts/p5.svg" alt="">
      <img src="assets/images/posts/p3.svg" alt=""><img src="assets/images/posts/p8.svg" alt=""><img src="assets/images/posts/p11.svg" alt="">
    </div>
  </section>
  <section class="auth__panel">
    <div class="auth__card">
      <a class="brand auth__mobile-brand" href="login.html" aria-label="SANS"><img src="assets/logo.svg" alt=""><span>SANS</span></a>
      <h1>Create your account</h1>
      <p>Join SANS and start building your space.</p>
      <form id="signupForm" novalidate>
        <div class="field"><label>Profile picture</label><div class="avatar-picker" id="avatarPicker"></div><input type="file" id="avatarFile" accept="image/*" class="hidden"></div>
        <div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" autocomplete="name" maxlength="40" placeholder="Alex Morgan"></div>
        <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" maxlength="20" placeholder="alex.morgan"><span class="field__hint">3 to 20 characters: letters, numbers, dots, underscores.</span></div>
        <div class="field"><label for="password">Password</label>
          <div class="input-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="">
          <button type="button" class="icon-btn" data-toggle-pw aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
        <div class="strength" id="strength" data-level="0" aria-hidden="true" style="margin:-8px 0 16px"><i></i><i></i><i></i><i></i></div>
        <div class="field"><label for="confirm">Confirm password</label>
          <div class="input-wrap"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="">
          <button type="button" class="icon-btn" data-toggle-pw aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div></div>
        <button class="btn btn--primary btn--block" type="submit" style="height:46px">Create account</button>
      </form>
      <p class="auth__alt">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
