<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages • SANS</title>
<meta name="description" content="SANS: Your people. Your space. Your world.">
<meta name="theme-color" content="#0e0f11">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sans_theme')||'dark'}catch(e){}</script>
</head>
<body class="is-loading" data-page="messages" data-protected>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div>
    <header class="topbar" id="topbar"></header>
    <main class="main main--wide" id="main">
      <div class="col" style="grid-column:1/-1;width:100%">
        <div class="card messages" id="messages">
          <section class="conv-list" aria-label="Conversations">
            <div class="conv-list__head">
              <div class="conv-list__title"><h2 style="font-size:20px">Messages</h2><button class="icon-btn" data-newchat aria-label="New message"><i class="fa-regular fa-pen-to-square"></i></button></div>
              <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="convSearch" type="search" placeholder="Search conversations" aria-label="Search conversations"></div>
            </div>
            <div class="conv-list__items" id="convItems"></div>
          </section>
          <section class="chat" id="chat" aria-label="Chat"></section>
        </div>
      </div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/posts.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
